name: Orbitals
version: '${version}'
main: com.thegildedking.orbitals.OrbitalsPlugin
api-version: '1.21'
author: TheGildedKing
description: Orbital strike items - stab, nuke, mob and wither cannon.

commands:
  orbital:
    description: Give orbital strike items or reload the config
    usage: "/orbital <give <stab|nuke|mob|wither|all> [player] | reload>"
    permission: orbitals.admin

permissions:
  orbitals.admin:
    description: Lets you spawn orbital items and reload the config
    default: op
