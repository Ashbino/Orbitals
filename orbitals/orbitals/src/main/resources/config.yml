# Max distance (blocks) you can aim an orbital at.
range: 200

# If false, the player who fired an orbital is not hurt by the stab or protected from nothing else
# (explosions and wither skulls can still hit you if you stand too close).
hurt-owner: false

# Cooldowns in seconds.
cooldowns:
  stab: 5
  nuke: 60
  mob: 30
  wither: 20

stab:
  damage: 40.0
  radius: 3.0

nuke:
  warning-seconds: 3
  power: 20.0
  break-blocks: true
  set-fire: false

mob:
  count: 15
  spread: 5.0
  lifetime-seconds: 60
  types: [ZOMBIE, SKELETON, SPIDER, CREEPER, WITCH, VINDICATOR]

wither:
  skulls: 14
  spread: 6.0
  yield: 2.5
