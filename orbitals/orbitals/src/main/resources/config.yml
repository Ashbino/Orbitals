# Max distance (blocks) you can aim an orbital at.
range: 200

# Every orbital is a single-use fishing rod with no cooldown: right-click to fire, the rod breaks.
# Note: TNT hurts you too if you stand near the target. On Spigot/Paper you may want
# "max-tnt-per-tick" raised in spigot.yml (e.g. 1000) so big nukes detonate smoothly.

# Nuke: rings of TNT fall from the sky and explode in a wave from the centre outwards.
nuke:
  rings: 8            # number of rings around the centre
  ring-spacing: 3.0   # blocks between rings
  height: 50          # how high above the target the TNT starts
  fuse: 40            # ticks before each TNT explodes (should be about how long it takes to fall)
  center-tnt: 15      # TNT in the centre cluster

# Stab: short-fuse TNT dropped down one column from the target to the bottom of the world.
stab:
  spacing: 3          # blocks between each TNT group going down
  tnt-count: 5        # TNT per group
  steps-per-tick: 3   # how many groups per tick (higher = faster drill)

# Mob orbital: the mob type is chosen when you give the item: /orbital give mob <mob>
mob:
  default-type: ZOMBIE  # used by /orbital give all
  count: 15
  spread: 5.0
  lifetime-seconds: 60

# Wither cannon: blue wither skulls from the sky.
wither:
  skulls: 14
  spread: 6.0
  yield: 2.5
